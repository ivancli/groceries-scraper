apiVersion: batch/v1
kind: Job
metadata:
  name: scrape-template
  namespace: groceries
  labels:
    app: scraper
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: scraper
    spec:
      restartPolicy: Never
      serviceAccountName: scrape
      containers:
        - name: scrape
          image: groceries-scraper:dev
          args: []
          envFrom:
            - secretRef: {name: scrape-sinks, optional: true}
          env:
            - {name: KEEP, value: template}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: runs, mountPath: /app/runs}
      volumes:
        - name: runs
          emptyDir: {}
