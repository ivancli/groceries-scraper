# The private-route proof (docs/search-connectivity-proof.md): a fixture responder reachable only
# through its own connector. Needs the `scraper-search-origin` and `scraper-search-connector`
# Secrets from that runbook; applied by hand with `kubectl apply -k`, deleted after the proof.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: groceries-scraper
resources:
  - responder.yaml
  - connector.yaml
  - network-policy.yaml
images:
  - name: groceries-scraper
    newTag: dev
