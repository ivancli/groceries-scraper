apiVersion: v1
kind: ServiceAccount
metadata:
  name: scraper-search-connector
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-search-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scraper-search-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scraper-search-connector
    spec:
      serviceAccountName: scraper-search-connector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # the distroless image's nonroot user
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # VPC needs >= 2025.7.0; pinned, so a connector change is a reviewed diff.
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - quic  # VPC can't use HTTP/2: fail visibly instead of falling back
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tunnel
              mountPath: /etc/cloudflared
              readOnly: true
      volumes:
        - name: tunnel
          secret:
            secretName: scraper-search-connector  # the remotely managed Tunnel's token only
            defaultMode: 0440
