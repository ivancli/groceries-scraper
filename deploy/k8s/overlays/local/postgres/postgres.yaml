# The system of record for price history (ADR-0004): back it up, never just recreate it.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None  # one replica: the name resolves straight to its pod
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: scrape
            - name: POSTGRES_DB
              value: scrape
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scrape-sinks
                  key: PGPASSWORD
            - name: PGDATA  # a subdirectory: initdb refuses a non-empty mount point
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, scrape, -d, scrape]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path  # k3d's: survives the pod, not `k3d cluster delete`
        resources:
          requests:
            storage: 5Gi
