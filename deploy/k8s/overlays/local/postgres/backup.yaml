apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400  # a PC that was off at 03:00 still backs up when it's back
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # hostPath files keep the pod's UID, so run as yours: change both if `id -u`/`id -g` aren't 1000.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: scrape-sinks
              env:
                - name: HOME  # the image has no account for your UID
                  value: /tmp
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: scrape
                - name: PGDATABASE
                  value: scrape
              # Only a complete dump gets a name the pruning counts, so a failed one never displaces a good one.
              command:
                - /bin/sh
                - -euc
                - |
                  keep=14
                  name="scrape-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  trap 'rm -f "/backups/.$name"' EXIT
                  pg_dump --format=custom --file="/backups/.$name"
                  mv "/backups/.$name" "/backups/$name"
                  ls /backups | grep -E '^scrape-[0-9TZ]+\.dump$' | sort -r | tail -n +$((keep + 1)) \
                    | while read -r old; do rm -- "/backups/$old"; done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              hostPath:
                path: /mnt/groceries-scraper/backups
                type: Directory
