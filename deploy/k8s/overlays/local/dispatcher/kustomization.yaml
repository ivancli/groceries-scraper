# `scrape dispatch` every 5 minutes, applied once with `kubectl apply -k`; it needs the
# `scrape-dispatcher` Secret and `scrape-job-template` ConfigMap from the README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: groceries-scraper
resources:
  - rbac.yaml
  - cronjob.yaml
images:
  - name: groceries-scraper
    newTag: dev
