# The restricted coordination role's Secret, for price Jobs and the search service only.
# `scrape coordinator setup` creates the role with this password; see the README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: groceries-scraper
secretGenerator:
  - name: scrape-coordinator
    options:
      disableNameSuffixHash: true  # Jobs reference it by name and aren't rendered here
    literals:
      - SCRAPE_COORDINATOR=postgresql://scrape_coordinator@postgres/scrape
      # Public, like scrape-sinks': the database is reachable only inside the cluster.
      - SCRAPE_COORDINATOR_PASSWORD=local-only-coordinator
