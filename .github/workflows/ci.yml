name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  image:
    needs: check  # never publish an image whose code failed the checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: groceries-scraper:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs scrape --help as a non-root user
        run: |
          docker run --rm "$IMAGE" --help
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != 0
      # Offline, so the checks below can't flake on a retailer or pass by fetching.
      - name: Validates every baked-in Site config
        run: >-
          docker run --rm --network none --entrypoint sh "$IMAGE"
          -c 'for f in sites/*.yaml; do scrape validate "$f" || exit 1; done'
      - name: Replays a Golden Fixture
        run: >-
          docker run --rm --network none -v "$PWD/tests/sites/aldi:/fixture:ro" "$IMAGE"
          replay /fixture --config sites/aldi.yaml
      # Playwright only launches the Chromium build it pins, so a launch proves the match.
      - name: Launches the Chromium of the locked Playwright
        run: |
          locked=$(sed -n '/^name = "playwright"$/{n;s/^version = "\(.*\)"$/\1/p}' uv.lock)
          docker run --rm --network none --entrypoint python "$IMAGE" -c '
          import sys
          from importlib.metadata import version
          from playwright.sync_api import sync_playwright
          assert version("playwright") == sys.argv[1], (version("playwright"), sys.argv[1])
          with sync_playwright() as p:
              print("playwright", sys.argv[1], "chromium", p.chromium.launch().version)' "$locked"
      - name: Pushes to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/groceries-scraper"
          for tag in "$GITHUB_SHA" main; do
            docker tag "$IMAGE" "$repo:$tag"
            docker push "$repo:$tag"
          done
