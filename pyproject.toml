[project]
name = "groceries-scraper"
version = "0.1.0"
description = "Config-driven groceries scraper."
authors = [
    { name = "Ivan Li", email = "ivan.li@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "jsonpath-ng>=1.8.0",
    "parsel>=1.12.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scrapy>=2.19.0",
    "scrapy-playwright>=0.0.48",
    "typer>=0.27.2",
]

[project.scripts]
scrape = "groceries_scraper.cli:app"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
s3 = [
    "boto3>=1.35",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[s3]>=5",
    "mypy>=2.3.1",
    "psycopg[binary]>=3.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jsonpath_ng", "jsonpath_ng.*", "boto3", "boto3.*", "botocore.*"]  # ship no type hints
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
